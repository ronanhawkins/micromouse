; Micromouse: ESP32-C6 firmware + native unit tests for the maze logic.
;   pio run -e mouse               build firmware
;   pio run -e mouse -t upload     flash (plug into the UART / "COM" USB port)
;   pio device monitor -e mouse    serial CLI
;   pio test -e native             run lib/maze unit tests on this computer

[platformio]
default_envs = mouse

[env:mouse]
; pioarduino = Arduino-ESP32 core 3.x (supports the C6). Pinned to 3.3.11: newer
; releases need PlatformIO Core >= 6.2.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11 -std=gnu++17
build_flags =
    -std=gnu++17
    -Wall
    ; Uncomment if you plug into the native USB port instead of the UART one.
    ; -D ARDUINO_USB_MODE=1
    ; -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    pololu/VL53L0X@^1.3.1
test_ignore = *

[env:native]
platform = native
build_flags = -std=c++17 -Wall -Wextra
test_framework = unity
